[package]
name = "kcreate_renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Offscreen wgpu renderer with CPU fallback for KCreate"

[lints]
workspace = true

[dependencies]
wgpu.workspace = true
raw-window-handle.workspace = true
pollster.workspace = true
bytemuck.workspace = true
tiny-skia.workspace = true
glam.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
thiserror.workspace = true
uuid.workspace = true
serde.workspace = true

# Text shaping + glyph outline extraction. The renderer's CPU backend
# converts a `Text` scene object into glyph path commands at draw
# time via this crate.
kcreate_text = { path = "../kcreate_text" }

[dev-dependencies]
criterion.workspace = true
# Timeline / Report phase instrumentation for the dense present-path
# proof example (cold-path profiling primitive, no networking).
kcreate_perf = { path = "../kcreate_perf" }

[features]
default = []
# Force the CPU backend even when a GPU adapter is available (useful for CI / headless tests / deterministic frames).
cpu-only = []
# Compile the dense-document builder (`dense_doc`). It is a dev / bench
# helper — the `frame_present_dense` bench, the `dense_present_proof`
# example, and the bridge's dev-only "seed dense doc" affordance — so it
# is gated off the default build and production renderer binaries never
# carry it. Pulls in no extra crates.
dev_seed = []

[[bench]]
name = "frame_render_empty"
harness = false

[[bench]]
name = "frame_render_shapes"
harness = false

[[bench]]
name = "frame_readback"
harness = false

[[bench]]
name = "viewport_pan"
harness = false

[[bench]]
name = "cold_start"
harness = false

[[bench]]
name = "frame_present_dense"
harness = false
# Uses the `dense_doc` builder, which only compiles under `dev_seed`.
required-features = ["dev_seed"]

[[example]]
name = "dense_present_proof"
# Uses the `dense_doc` builder, which only compiles under `dev_seed`.
required-features = ["dev_seed"]
