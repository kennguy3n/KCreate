[workspace]
resolver = "2"
members = [
    "crates/kcreate_renderer",
    "crates/kcreate_bridge",
    "crates/kcreate_core",
    "crates/kcreate_storage",
    "crates/kcreate_vector",
    "crates/kcreate_export",
    "crates/kcreate_tests",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
authors = ["KCreate contributors"]
repository = "https://github.com/kennguy3n/KCreate"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"

[workspace.dependencies]
# GPU rendering
wgpu = { version = "29.0", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "gles", "naga-ir", "std", "wgpu-core"] }
pollster = "0.4"
bytemuck = { version = "1.16", features = ["derive"] }

# CPU rasterization fallback (real, production-quality software renderer)
tiny-skia = "0.11"

# Math
glam = { version = "0.29", features = ["bytemuck"] }

# Async / sync
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Logging / errors
log = "0.4"
thiserror = "1.0"

# Cross-platform shared memory for frame buffers
shared_memory = "0.12"

# Identifiers
uuid = { version = "1.10", features = ["v4", "serde"] }

# Serialization (used in display list cache + IPC payloads)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# Persistence (statically linked SQLite)
rusqlite = { version = "0.34", features = ["bundled", "blob", "chrono", "uuid"] }

# Content-addressed hashing
blake3 = "1.5"

# Path math
kurbo = { version = "0.11", features = ["serde"] }

# Polygon boolean operations (Greiner–Hormann / Vatti family, real production-grade impl)
i_overlay = "2"

# SVG parsing
usvg = "0.44"

# Spatial index
rstar = "0.12"

# Raster encoding (PNG)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# System info probe for device tiering
sys-info = "0.9"

# Benchmarks
criterion = { version = "0.5", features = ["html_reports"] }

# Test fixtures
tempfile = "3"

# N-API bindings
# `dyn-symbols` resolves napi symbols at runtime via libloading so the crate
# can be unit-tested without a live Node.js process providing static symbols
# at link time. When loaded by Node it transparently uses the host's symbols.
napi = { version = "2.16", default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = "2.16"
napi-build = "2.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1
debug = true
