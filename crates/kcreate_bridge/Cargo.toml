[package]
name = "kcreate_bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "N-API bridge between the Electron renderer process and the kcreate_renderer crate"
build = "build.rs"

[lints]
workspace = true

[lib]
name = "kcreate_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
kcreate_renderer = { path = "../kcreate_renderer" }
kcreate_core = { path = "../kcreate_core" }
kcreate_storage = { path = "../kcreate_storage" }
kcreate_export = { path = "../kcreate_export" }
kcreate_raster = { path = "../kcreate_raster" }
kcreate_vector = { path = "../kcreate_vector" }
kcreate_ai = { path = "../kcreate_ai" }
kcreate_audit = { path = "../kcreate_audit" }
# Phase 8 Block E Task 27: lightweight cold-path / startup
# profiling primitives. The crate has no networking and no async,
# so it is safe to live in the editing-path closure walked by
# `local_first.rs`.
kcreate_perf = { path = "../kcreate_perf" }
# The MCP server is the *only* component of the editing-side runtime
# that links a networking library (`tiny_http`). Per AGENTS.md the
# editing path must stay network-free, so this is optional and gated
# on the `mcp` feature flag; default builds don't pull `tiny_http`.
# The Electron host enables `mcp` explicitly when packaging the
# release binary, and `crates/kcreate_tests/tests/local_first.rs`
# checks the default-feature dep tree.
kcreate_mcp = { path = "../kcreate_mcp", optional = true }
kcreate_text = { path = "../kcreate_text" }
kcreate_layout = { path = "../kcreate_layout" }
kcreate_plugin = { path = "../kcreate_plugin" }
napi.workspace = true
napi-derive.workspace = true
parking_lot.workspace = true
log.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
base64.workspace = true
image.workspace = true
rayon.workspace = true
# Used by `src/thumbnails.rs` to content-address cached thumbnail
# bytes so re-saving identical content is a no-op and cache lookups
# can skip the disk write entirely. Already in the workspace graph
# via `kcreate_storage` and `kcreate_plugin`, so adding it here does
# not extend the editing-path closure walked by the local-first
# sentinel.
blake3 = { workspace = true }
# Phase 9 Task 25: cross-platform memory-pressure probe. Pure Rust,
# no networking, no async runtime — safe inside the editing-path
# closure walked by `crates/kcreate_tests/tests/local_first.rs`.
sysinfo.workspace = true
# Used only behind the `native_canvas` feature to interpret raw
# window handle bytes (NSView* / HWND / XID / wl_surface*) ferried
# from the Electron main process. The default build does not link
# this crate at all, so default builds stay free of unsafe pointer
# math.
raw-window-handle = { workspace = true, optional = true }
# Used only behind the `native_canvas` feature for the shared-memory
# frame handoff (publisher mmaps a framebuffer ring the renderer
# process reads directly, eliminating the per-frame IPC copy). The
# default build does not link it. `memmap2` is already in the
# workspace graph (via `fontdb` → `kcreate_text`), so gating it here
# does not widen the default editing-path closure the local-first
# sentinel walks; the `unsafe` mmap calls live solely in
# `native_canvas.rs` (the only module allowed `unsafe`).
memmap2 = { version = "0.9", optional = true }
# Phase 3 LAN transport. Like `kcreate_mcp`, this is the *only* path
# by which the bridge can pull a network stack — `kcreate_collab`
# itself is transport-agnostic and stays in the editing path, but
# `kcreate_collab_transport` carries quinn / rustls / mdns-sd /
# tokio. Off by default; the local-first sentinel
# (`crates/kcreate_tests/tests/local_first.rs`) keeps it that way.
kcreate_collab = { path = "../kcreate_collab", optional = true }
kcreate_collab_transport = { path = "../kcreate_collab_transport", optional = true }
# Dev-only KChat membership issuer. Pulled in ONLY behind the
# `kchat-dev-issuer` feature (off by default). When enabled the
# bridge exposes a `kchat_dev_mint_membership` N-API entry point
# that lets the renderer mint a test attestation locally. Never
# enable in production builds — minting your own attestation
# subverts the multiplayer trust root.
kcreate_kchat = { path = "../kcreate_kchat", optional = true }
# Phase 7 KChat backend REST client. Pulled in ONLY behind the
# `kchat-backend` feature flag (off by default). The client speaks
# HTTPS REST to the shared KChat / Mattermost backend
# uney-chat-desktop also uses. Because it links `reqwest` it must
# stay out of the default editing-path closure walked by
# `local_first.rs`.
kcreate_kchat_client = { path = "../kcreate_kchat_client", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
# Used only behind the `collab` feature to decode an Ed25519 public
# key from the wire-form base64url string into a `VerifyingKey` for
# the peer-id derivation sanity check in `collab::identity_from_wire`.
# Already in the editing-path tree via `kcreate_plugin`, so adding
# the dependency here under a feature flag doesn't change the
# default-feature graph the local-first sentinel walks.
ed25519-dalek = { workspace = true, optional = true }
# Phase 7 (Task 23): OS RNG for fresh ChaCha20-Poly1305 nonces on
# the clipboard-share send path. Only used under the `collab`
# feature.
getrandom = { workspace = true, optional = true }
# tracing is pulled in by quinn / rustls under the `collab` feature;
# we use it directly for `tracing::warn!` in the pump task.
tracing = { workspace = true, optional = true }
# Phase 12 (Devin Review): proper POSIX shell-word splitting for
# the `KCREATE_SD_SERVER_EXTRA_ARGS` env var passthrough used by
# `image_gen_start`. The previous naive `split_whitespace` parser
# silently dropped the second half of any path containing spaces,
# which made Windows installs (e.g. `C:\Program Files\sd-models\…`)
# unable to load FLUX component weights.
shell-words = { workspace = true }

[build-dependencies]
napi-build.workspace = true

[dev-dependencies]
# The bridge state machine is a process-global singleton, so tests that
# mutate it must run serialized.
serial_test = "3"
# Re-import `kcreate_perf` under its `test_support` feature so the bridge's
# test path can call `kcreate_perf::startup::reset_for_tests()` to clear
# the process-wide startup timeline between cases. Without this, bridge
# tests sharing the singleton became subtly order-dependent (Devin Review
# ANALYSIS_0003 round 3 on PR #24). The feature is dev-only and not enabled
# in the production dep above, so the local-first sentinel + release builds
# are unaffected.
kcreate_perf = { path = "../kcreate_perf", features = ["test_support"] }
tempfile.workspace = true
# WAT plugin fixtures for the Phase 2 Block C plugin-context tests
# (see `document.rs::tests::plugin_execute_with_context_*`). Pinned
# to the same major as `kcreate_plugin` to keep wasmi compatibility.
wat = "1"
# Criterion drives the scene-sync presence overlay micro-benchmarks
# (`benches/scene_sync_multi_peer.rs`). Kept as a dev-dependency so
# release builds of the bridge don't link it.
criterion.workspace = true
# Phase 6 Task 19-20: the Sketch importer bridge tests construct a
# minimal `.sketch` archive in memory (document.json + pages/<uuid>.json
# + images/<png>) so the round-trip exercises the real ZIP-backed
# parser path. Already a workspace dep via `kcreate_export`, so this
# only widens its visibility into the bridge's dev-deps.
zip = { workspace = true }

[[bench]]
name = "scene_sync_multi_peer"
harness = false

# Phase 7 (Task 28): collab performance benchmarks. Requires the
# `collab` feature so the bench can pull in `kcreate_collab` /
# `ed25519-dalek` for journal + envelope construction. The bench
# never touches the QUIC transport — the cost we care about is in
# the editing-path crates (journal, CRDT, signing, serialisation),
# all of which are network-free.
[[bench]]
name = "collab_perf"
harness = false
required-features = ["collab"]

# Native / shared-memory present benchmark. Requires `native_canvas`
# so the bench can construct the `shared_present` ring publisher +
# reader. Compares the per-frame full-frame copy the IPC path ships
# (`take_present(0.0)` materialises a fresh framebuffer Vec every
# frame) against the shared-memory handoff (publish into a pre-mapped
# ring slot + a renderer-side read), which moves zero bytes over IPC.
[[bench]]
name = "shared_present_dense"
harness = false
required-features = ["native_canvas"]

[features]
default = []
# Mirror the renderer's CPU-only feature flag for headless N-API builds.
cpu-only = ["kcreate_renderer/cpu-only"]
# Enable the local MCP sidecar (loopback-only HTTP JSON-RPC). Off by
# default so the editing path stays free of networking libraries; the
# Electron host enables this when packaging the release binary.
mcp = ["dep:kcreate_mcp"]
# Enable the LLM sidecar bridge (loopback-only HTTP to `llama-server`).
# Off by default for the same reason as `mcp`: the editing-path
# deny-list check runs without features, so default builds stay
# network-free. The Electron host enables this for release binaries.
llm = ["kcreate_ai/llm_sidecar"]
# Enable the native-canvas presentation path. This is the only
# component of the bridge that uses `unsafe` code, exclusively for
# wrapping raw window handle bytes provided by Electron's
# `BrowserWindow::getNativeWindowHandle()`. Off by default so the
# Phase 0 / Phase 1 default build is `unsafe`-free; the Electron
# host enables it when the user opts in via the settings toggle.
native_canvas = ["dep:raw-window-handle", "dep:memmap2"]
# Enable the LAN collaboration transport (QUIC + mDNS) and the
# `session_*` IPC surface that drives the Phase 3 presence UI. Off
# by default so the local-first sentinel keeps quinn / rustls /
# mdns-sd out of the editing-path dependency tree; the Electron
# host enables this when packaging a release that ships collab.
collab = ["dep:kcreate_collab", "dep:kcreate_collab_transport", "dep:tokio", "dep:ed25519-dalek", "dep:getrandom", "dep:tracing"]
# Enable the dev-only KChat membership issuer N-API surface. Implies
# `collab` (since the install path runs through the collab gate).
# Off by default; non-dev builds must NOT enable this — minting a
# membership locally bypasses the trust root the real KChat product
# pins to its own keypair.
kchat-dev-issuer = ["collab", "dep:kcreate_kchat"]
# Phase 7: enable the real KChat backend REST client. Implies
# `collab` (the bridge installs the wire attestation into the collab
# gate). Off by default; non-collab builds must NOT enable this. The
# crate it pulls in (`kcreate_kchat_client`) links `reqwest`
# (HTTPS only in production, plain HTTP only inside the in-process
# test fixture) — never on the editing path — and is excluded from
# the closure walked by `local_first.rs`.
kchat-backend = ["collab", "dep:kcreate_kchat_client"]
