[package]
name = "kcreate_storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SQLite + content-addressed blob store + .kstudio project I/O for KCreate"

[lints]
workspace = true

[dependencies]
kcreate_core = { path = "../kcreate_core" }
rusqlite.workspace = true
blake3.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
chrono.workspace = true
thiserror.workspace = true
log.workspace = true
hex = "0.4"
base64.workspace = true
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
# Phase 11 Block E follow-up — Devin Review ANALYSIS-0008.
# Key wiping for the cached SQLCipher key on Drop / explicit
# `clear_cached_key`. Plain `for byte in iter { *byte = 0 }` is
# permitted to be dead-code-eliminated by LLVM because the buffer
# is never read after the loop. `zeroize` uses inline-asm /
# volatile primitives to defeat that optimisation. Already
# resident transitively via `chacha20poly1305` + `curve25519-dalek`,
# so adding the direct dep is free.
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3.10"
