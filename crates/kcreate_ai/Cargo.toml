[package]
name = "kcreate_ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Local AI sidecar (Phase 0 threshold bg-removal) for KCreate"

[lints]
workspace = true

[dependencies]
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
parking_lot.workspace = true
chrono.workspace = true
kcreate_core = { path = "../kcreate_core" }
log.workspace = true
rayon.workspace = true
base64.workspace = true
# `ureq` is the blocking HTTP client used by the LLM sidecar (Tasks
# 16–18) to talk to `llama-server` over loopback (127.0.0.1). It is
# gated behind the `llm_sidecar` feature so default builds — and the
# editing-path crates that depend on `kcreate_ai` — stay free of
# networking libraries. The deny-list check in
# `crates/kcreate_tests/tests/local_first.rs` runs with default
# features, so this exception is enforced.
ureq = { version = "2", default-features = false, features = ["json"], optional = true }
# `ort` (ONNX Runtime bindings) is opt-in behind `onnx_bg_removal`.
# Off by default because it pulls a large native runtime binary that
# CI Linux/macOS images don't have preinstalled. When the feature is
# off the editing path stays unchanged.
ort = { version = "2.0.0-rc.10", default-features = false, features = ["copy-dylibs", "download-binaries", "ndarray"], optional = true }

[dev-dependencies]
criterion.workspace = true
tiny_http = "0.12"
tempfile.workspace = true

[[bench]]
name = "bg_remove"
harness = false

[[bench]]
name = "upscale"
harness = false

[[bench]]
name = "palette"
harness = false

[[bench]]
name = "smart_select"
harness = false

[features]
default = []
# Enables the loopback HTTP client used by the LLM sidecar driver.
# Pulls `ureq`, which would otherwise be in the editing-path deny list.
llm_sidecar = ["dep:ureq"]
# Enables the u²-net ONNX background-removal backend. Pulls `ort`,
# which bundles the ONNX Runtime native binary at build time.
onnx_bg_removal = ["dep:ort"]
