[package]
name = "kcreate_bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "N-API bridge between the Electron renderer process and the kcreate_renderer crate"
build = "build.rs"

[lints]
workspace = true

[lib]
name = "kcreate_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
kcreate_renderer = { path = "../kcreate_renderer" }
kcreate_core = { path = "../kcreate_core" }
kcreate_storage = { path = "../kcreate_storage" }
kcreate_export = { path = "../kcreate_export" }
kcreate_raster = { path = "../kcreate_raster" }
kcreate_vector = { path = "../kcreate_vector" }
kcreate_ai = { path = "../kcreate_ai" }
# The MCP server is the *only* component of the editing-side runtime
# that links a networking library (`tiny_http`). Per AGENTS.md the
# editing path must stay network-free, so this is optional and gated
# on the `mcp` feature flag; default builds don't pull `tiny_http`.
# The Electron host enables `mcp` explicitly when packaging the
# release binary, and `crates/kcreate_tests/tests/local_first.rs`
# checks the default-feature dep tree.
kcreate_mcp = { path = "../kcreate_mcp", optional = true }
kcreate_text = { path = "../kcreate_text" }
kcreate_layout = { path = "../kcreate_layout" }
kcreate_plugin = { path = "../kcreate_plugin" }
napi.workspace = true
napi-derive.workspace = true
parking_lot.workspace = true
log.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { workspace = true, features = ["serde"] }
base64.workspace = true
image.workspace = true
rayon.workspace = true
# Used only behind the `native_canvas` feature to interpret raw
# window handle bytes (NSView* / HWND / XID / wl_surface*) ferried
# from the Electron main process. The default build does not link
# this crate at all, so default builds stay free of unsafe pointer
# math.
raw-window-handle = { workspace = true, optional = true }
# Phase 3 LAN transport. Like `kcreate_mcp`, this is the *only* path
# by which the bridge can pull a network stack — `kcreate_collab`
# itself is transport-agnostic and stays in the editing path, but
# `kcreate_collab_transport` carries quinn / rustls / mdns-sd /
# tokio. Off by default; the local-first sentinel
# (`crates/kcreate_tests/tests/local_first.rs`) keeps it that way.
kcreate_collab = { path = "../kcreate_collab", optional = true }
kcreate_collab_transport = { path = "../kcreate_collab_transport", optional = true }
# Dev-only KChat membership issuer. Pulled in ONLY behind the
# `kchat-dev-issuer` feature (off by default). When enabled the
# bridge exposes a `kchat_dev_mint_membership` N-API entry point
# that lets the renderer mint a test attestation locally. Never
# enable in production builds — minting your own attestation
# subverts the multiplayer trust root.
kcreate_kchat = { path = "../kcreate_kchat", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
# Used only behind the `collab` feature to decode an Ed25519 public
# key from the wire-form base64url string into a `VerifyingKey` for
# the peer-id derivation sanity check in `collab::identity_from_wire`.
# Already in the editing-path tree via `kcreate_plugin`, so adding
# the dependency here under a feature flag doesn't change the
# default-feature graph the local-first sentinel walks.
ed25519-dalek = { workspace = true, optional = true }
# tracing is pulled in by quinn / rustls under the `collab` feature;
# we use it directly for `tracing::warn!` in the pump task.
tracing = { workspace = true, optional = true }

[build-dependencies]
napi-build.workspace = true

[dev-dependencies]
# The bridge state machine is a process-global singleton, so tests that
# mutate it must run serialized.
serial_test = "3"
tempfile.workspace = true
# WAT plugin fixtures for the Phase 2 Block C plugin-context tests
# (see `document.rs::tests::plugin_execute_with_context_*`). Pinned
# to the same major as `kcreate_plugin` to keep wasmi compatibility.
wat = "1"
# Criterion drives the scene-sync presence overlay micro-benchmarks
# (`benches/scene_sync_multi_peer.rs`). Kept as a dev-dependency so
# release builds of the bridge don't link it.
criterion.workspace = true

[[bench]]
name = "scene_sync_multi_peer"
harness = false

[features]
default = []
# Mirror the renderer's CPU-only feature flag for headless N-API builds.
cpu-only = ["kcreate_renderer/cpu-only"]
# Enable the local MCP sidecar (loopback-only HTTP JSON-RPC). Off by
# default so the editing path stays free of networking libraries; the
# Electron host enables this when packaging the release binary.
mcp = ["dep:kcreate_mcp"]
# Enable the LLM sidecar bridge (loopback-only HTTP to `llama-server`).
# Off by default for the same reason as `mcp`: the editing-path
# deny-list check runs without features, so default builds stay
# network-free. The Electron host enables this for release binaries.
llm = ["kcreate_ai/llm_sidecar"]
# Enable the native-canvas presentation path. This is the only
# component of the bridge that uses `unsafe` code, exclusively for
# wrapping raw window handle bytes provided by Electron's
# `BrowserWindow::getNativeWindowHandle()`. Off by default so the
# Phase 0 / Phase 1 default build is `unsafe`-free; the Electron
# host enables it when the user opts in via the settings toggle.
native_canvas = ["dep:raw-window-handle"]
# Enable the LAN collaboration transport (QUIC + mDNS) and the
# `session_*` IPC surface that drives the Phase 3 presence UI. Off
# by default so the local-first sentinel keeps quinn / rustls /
# mdns-sd out of the editing-path dependency tree; the Electron
# host enables this when packaging a release that ships collab.
collab = ["dep:kcreate_collab", "dep:kcreate_collab_transport", "dep:tokio", "dep:ed25519-dalek", "dep:tracing"]
# Enable the dev-only KChat membership issuer N-API surface. Implies
# `collab` (since the install path runs through the collab gate).
# Off by default; non-dev builds must NOT enable this — minting a
# membership locally bypasses the trust root the real KChat product
# pins to its own keypair.
kchat-dev-issuer = ["collab", "dep:kcreate_kchat"]
