[package]
name = "kcreate_ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Local AI sidecar (Phase 0 threshold bg-removal) for KCreate"

[lints]
workspace = true

[dependencies]
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
parking_lot.workspace = true
chrono.workspace = true
kcreate_core = { path = "../kcreate_core" }
# Pure flex/grid layout solvers — used by the themed-deck generator
# (`themed_deck.rs`) to position headings/body without hand-placed
# coordinates. No networking, no DOM; safe in the editing path.
kcreate_layout = { path = "../kcreate_layout" }
log.workspace = true
rayon.workspace = true
base64.workspace = true
# `sha2` is used by the model-pack installer (`install_model_pack`)
# to verify the SHA-256 of weights files the user points at. Pure
# Rust, no networking, no dynamic linking — safe to depend on from
# the editing path.
sha2 = "0.10"
# Phase 11 Block E Task 25 — `getrandom` sources bytes from the OS
# CSPRNG to mint the per-session bearer token the LLM sidecar
# uses to authenticate clients. Pure-Rust, no networking; safe in
# the editing path even when `llm_sidecar` is off (it just isn't
# called).
#
# Phase 11 Block E follow-up — Devin Review ANALYSIS-0002.
# Routed through the workspace dep so every caller (kcreate_collab
# AEAD nonces, kcreate_bridge clipboard share, this sidecar token
# minter) sees the same version + API. The workspace was bumped
# from 0.2 to 0.3 alongside this change.
getrandom.workspace = true
# `ureq` is the blocking HTTP client used by the LLM sidecar (Tasks
# 16–18) to talk to `llama-server` over loopback (127.0.0.1). It is
# gated behind the `llm_sidecar` feature so default builds — and the
# editing-path crates that depend on `kcreate_ai` — stay free of
# networking libraries. The deny-list check in
# `crates/kcreate_tests/tests/local_first.rs` runs with default
# features, so this exception is enforced.
ureq = { version = "2", default-features = false, features = ["json"], optional = true }
# `ort` (ONNX Runtime bindings) is opt-in behind `onnx_bg_removal`.
# Off by default because it pulls a large native runtime binary that
# CI Linux/macOS images don't have preinstalled. When the feature is
# off the editing path stays unchanged.
ort = { version = "2.0.0-rc.10", default-features = false, features = ["copy-dylibs", "download-binaries", "ndarray"], optional = true }

[dev-dependencies]
criterion.workspace = true
tiny_http = "0.12"
tempfile.workspace = true

[[bench]]
name = "bg_remove"
harness = false

[[bench]]
name = "upscale"
harness = false

[[bench]]
name = "palette"
harness = false

[[bench]]
name = "smart_select"
harness = false

[features]
default = []
# Enables the loopback HTTP client used by the LLM sidecar driver.
# Pulls `ureq`, which would otherwise be in the editing-path deny list.
llm_sidecar = ["dep:ureq"]
# Enables the u²-net ONNX background-removal backend. Pulls `ort`,
# which bundles the ONNX Runtime native binary at build time.
onnx_bg_removal = ["dep:ort"]
# Enables the Real-ESRGAN x4 ONNX upscale backend. Shares the `ort`
# native runtime with `onnx_bg_removal`; can be enabled independently.
onnx_upscale = ["dep:ort"]
# Enables the SAM (Segment-Anything) ONNX segmentation backend. Shares
# the `ort` runtime with the other ONNX features.
onnx_segment = ["dep:ort"]
