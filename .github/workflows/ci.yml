name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-13, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install gpu deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxcb1-dev libgl1 libvulkan1 \
            mesa-vulkan-drivers
      - name: macos build environment
        if: runner.os == 'macOS'
        # No extra packages needed — Metal ships with macOS, Xcode CLT is preinstalled
        # on GitHub's macos-13 runner. CPU fallback works headless.
        run: clang --version
      - name: windows build environment
        if: runner.os == 'Windows'
        # No extra packages needed — D3D12 ships with the runner; if no GPU
        # adapter is reachable in CI, the tiny-skia software backend is used.
        shell: pwsh
        run: |
          cl /Bv 2>&1 | Select-Object -First 1
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo bench (compile only)
        run: cargo bench -p kcreate_renderer --no-run

  node:
    name: node (typescript)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
