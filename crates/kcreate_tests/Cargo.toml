[package]
name = "kcreate_tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Cross-crate integration tests for the KCreate workspace."

[lib]
# This crate exists only to host integration tests under `tests/`. The
# library file is intentionally empty.
path = "src/lib.rs"

[features]
# Cargo-feature passthrough so tests/ai_backends.rs can exercise both
# the unavailable-when-feature-off path AND the feature-on path
# (e.g. `cargo test -p kcreate_tests --features onnx_upscale`). The
# feature isolation in `kcreate_ai` is what keeps the editing path
# free of `ort` in default builds; we don't enable the feature here.
default = []
onnx_upscale = ["kcreate_ai/onnx_upscale"]
onnx_segment = ["kcreate_ai/onnx_segment"]

[dev-dependencies]
# `llm_sidecar` brings in `ureq` for the loopback HTTP client used by
# the Phase 1/3/4 sidecars. The deny-list test
# (`tests/local_first.rs`) checks the editing-path crates with
# default features only, so enabling it for the integration tests
# does not weaken the invariant.
kcreate_ai = { path = "../kcreate_ai", features = ["llm_sidecar"] }
kcreate_audit = { path = "../kcreate_audit" }
kcreate_collab = { path = "../kcreate_collab" }
kcreate_core = { path = "../kcreate_core" }
kcreate_export = { path = "../kcreate_export" }
kcreate_mcp = { path = "../kcreate_mcp" }
kcreate_raster = { path = "../kcreate_raster" }
kcreate_renderer = { path = "../kcreate_renderer" }
kcreate_storage = { path = "../kcreate_storage" }
kcreate_text = { path = "../kcreate_text" }
kcreate_vector = { path = "../kcreate_vector" }
chrono = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tiny_http = "0.12"
uuid = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
