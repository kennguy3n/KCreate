[package]
name = "kcreate_text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Font discovery (fontdb) + text shaping (rustybuzz) for KCreate"

[lints]
workspace = true

[dependencies]
fontdb.workspace = true
rustybuzz.workspace = true
serde.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
log.workspace = true
# `kcreate_text` consumes `Bounds`, `TextFrameOptions`, and
# `OpenTypeFeatures` from `kcreate_core`. The reverse dependency does
# not exist (`kcreate_core` is the shared types crate and depends on
# nothing else in-tree), so this edge introduces no cycle.
kcreate_core = { path = "../kcreate_core" }
