name: ci

# CI strategy (changed on PR #2 after observed runner-shortage stalls):
#
# Every PR runs the *fast lane* by default — Linux Rust (clippy + tests) and
# the Node TypeScript checks. That gives sub-25-minute feedback even when
# GitHub's hosted runner pool is saturated.
#
# The cross-platform matrix (macOS + Windows) is gated and only runs when:
#   - a PR is labeled `full-ci` (preferred), or
#   - a commit message contains `[full-ci]` (one-shot opt-in), or
#   - the change has landed on `main`, or
#   - the workflow is triggered manually via `workflow_dispatch`.
#
# Every job carries a `timeout-minutes` so no run can hang forever in the
# queue or in cargo's link step.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Fast lane — runs on every PR.
  rust:
    name: rust (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    # Force every `cargo test` process in this lane onto the CPU rasterizer.
    # On a headless runner wgpu falls back to Mesa's software Vulkan
    # (lavapipe), which JIT-compiles shaders through LLVM; a test process that
    # starts exiting while that work is still resident can fault as the C
    # runtime finalizes the Mesa/LLVM shared libraries underneath it — a
    # non-deterministic teardown SIGSEGV/SIGABRT that fires *after* every test
    # reports `ok` and only ever shows up as flaky CI. Declining the GPU here
    # makes the lane deterministic; it is behavior-preserving because the GPU
    # backend rasterizes through the same CPU compositor and only round-trips
    # the result through wgpu, so pixels are byte-identical on this lane.
    # The real wgpu present path stays covered every PR by the `smoke` lane
    # (which boots the packaged app via `process.dlopen`, not Cargo, so it
    # never sees this var) and by the macOS/Windows matrix below. See
    # `crates/kcreate_renderer/src/lib.rs` (`DISABLE_GPU_ENV`).
    env:
      KCREATE_DISABLE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: install gpu + font deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxcb1-dev libgl1 libvulkan1 \
            mesa-vulkan-drivers \
            libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace --all-targets
      # Feature-gated code the default steps above never compile: the
      # shared-memory present path (`native_canvas`, the only `unsafe` in
      # the tree) and the dev-only dense-doc seed affordance (`dev_seed`).
      # `native_canvas` now ships ON by default in packaged builds (see
      # `stage-bridge.mjs`), so its clippy + tests are a required gate, not
      # an afterthought. `--all-targets` here also debug-compiles the
      # feature-gated benches (`shared_present_dense`, `frame_present_dense`)
      # and the `dense_present_proof` example, so they can't bitrot even
      # though the slow release-profile bench sweep lives on the gated
      # cross-platform lane below (see the note where the fast lane ends).
      - name: cargo clippy (native_canvas + dev_seed)
        run: cargo clippy -p kcreate_bridge --all-targets --features native_canvas,dev_seed -- -D warnings
      - name: cargo clippy (renderer dev_seed)
        run: cargo clippy -p kcreate_renderer --all-targets --features dev_seed -- -D warnings
      - name: cargo test (native_canvas + dev_seed)
        run: cargo test -p kcreate_bridge --features native_canvas,dev_seed
      # Hard gate the local-first invariant. `cargo test --workspace`
      # already exercises this, but running it as a discrete step
      # makes the failure mode unmistakable in the CI summary the day
      # someone accidentally pulls a network crate into the editing
      # path.
      - name: local-first sentinel
        run: cargo test -p kcreate_tests --test local_first
      # Phase 3 foundation: kcreate_collab is intentionally isolated
      # from the editing path. Run its tests in their own step so a
      # protocol regression cannot hide behind other crates' output.
      - name: collab protocol tests
        run: cargo test -p kcreate_collab --all-targets
      # NOTE: the release-profile `cargo bench --no-run` sweep runs on the
      # gated cross-platform lane below (and on every push to `main`), not
      # here. Compiling all benches in the release/bench profile added ~10min
      # and pushed this lane past its 25min budget. Every bench still gets a
      # debug compile on each PR — non-gated benches via
      # `cargo {clippy,test} --workspace --all-targets`, and the
      # `native_canvas`/`dev_seed`-gated benches via the `--all-targets`
      # clippy steps above — so this only defers release-profile-only compile
      # errors (rare) to merge time.

  # Cross-platform lane — gated. See header comment for opt-in triggers.
  rust-extended:
    name: rust (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) ||
      contains(github.event.head_commit.message, '[full-ci]')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: macos build environment
        if: runner.os == 'macOS'
        # Metal ships with macOS; Xcode CLT is preinstalled on macos-13.
        # CPU fallback works headless.
        run: clang --version
      - name: windows build environment
        if: runner.os == 'Windows'
        # MSVC + D3D12 ship with the runner. cargo finds cl.exe via its
        # own probe; we just log the rustc host triple.
        shell: pwsh
        run: rustc --version --verbose
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace --all-targets
      # Mirror the fast lane's feature-gated coverage on macOS + Windows,
      # where the mmap-backed shared present (`native_canvas`) has
      # platform-specific code paths worth exercising.
      - name: cargo clippy (native_canvas + dev_seed)
        run: cargo clippy -p kcreate_bridge --all-targets --features native_canvas,dev_seed -- -D warnings
      - name: cargo test (native_canvas + dev_seed)
        run: cargo test -p kcreate_bridge --features native_canvas,dev_seed
      - name: local-first sentinel
        run: cargo test -p kcreate_tests --test local_first
      - name: collab protocol tests
        run: cargo test -p kcreate_collab --all-targets
      - name: cargo bench (compile only)
        run: |
          cargo bench -p kcreate_renderer --no-run --features dev_seed
          cargo bench -p kcreate_bridge --no-run --features native_canvas,dev_seed
          cargo bench -p kcreate_export --no-run
          cargo bench -p kcreate_raster --no-run
          cargo bench -p kcreate_ai --no-run
          cargo bench -p kcreate_layout --no-run

  node:
    name: node (typescript)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: test
        run: pnpm test

  # Electron boot + present-path smoke. This is the lane that would have
  # caught the WS-1 (clean build never booted) and WS-2 (canvas blank /
  # present loop frozen) regressions that survived twelve "complete" phases
  # because nothing in CI ever launched the packaged app. It builds the
  # bridge cdylib + the main/preload/renderer bundles, then drives the real
  # Electron binary through playwright-core's `_electron` harness under Xvfb:
  # boot to HomePage, open the editor, seed a high-contrast rect via the real
  # `canvas.createNodes` API, and assert the Rust-rendered frame reaches the
  # HTML <canvas>.
  smoke:
    name: smoke (electron boot + present)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: install bridge build + electron runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxcb1-dev libfontconfig1-dev \
            xvfb \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 \
            libgtk-3-0 libasound2 libxshmfence1 libxdamage1 libxfixes3 \
            libxcomposite1 libxrandr2 libxkbcommon0 libpango-1.0-0 libcairo2 \
            libxcb1 libxext6 libx11-xcb1 libgl1 libvulkan1 \
            mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
      # Debug cdylib built WITH `native_canvas` so the smoke lane boots the
      # same shared-memory present path that ships on by default (see
      # `stage-bridge.mjs`); the renderer still falls back to dirty-rect
      # IPC if the shared handoff is unavailable, so this also guards that
      # fallback. `dev_seed` is intentionally omitted — the e2e drives the
      # real `canvas.createNodes` API, not the dev seed affordance. The
      # harness resolves the artifact via KCREATE_BRIDGE_PROFILE=debug ->
      # target/debug/libkcreate_bridge.so.
      - name: build bridge cdylib
        run: cargo build -p kcreate_bridge --features native_canvas
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.11.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm 10 skips electron's postinstall, so the binary is never fetched
      # by `pnpm install` alone. Run the downloader explicitly.
      - name: fetch electron binary
        run: node apps/desktop/node_modules/electron/install.js
      - name: build app bundles (main/preload/renderer)
        run: pnpm build
      # GitHub hosted runners can't use Chromium's setuid sandbox, so opt into
      # --no-sandbox via env; Xvfb provides the headless X display.
      - name: electron smoke test
        working-directory: apps/desktop
        env:
          KCREATE_BRIDGE_PROFILE: debug
          KCREATE_E2E_NO_SANDBOX: "1"
        run: xvfb-run -a pnpm test:e2e
