[package]
name = "kcreate_tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "Cross-crate integration tests for the KCreate workspace."

[lib]
# This crate exists only to host integration tests under `tests/`. The
# library file is intentionally empty.
path = "src/lib.rs"

[features]
# Cargo-feature passthrough so tests/ai_backends.rs can exercise both
# the unavailable-when-feature-off path AND the feature-on path
# (e.g. `cargo test -p kcreate_tests --features onnx_upscale`). The
# feature isolation in `kcreate_ai` is what keeps the editing path
# free of `ort` in default builds; we don't enable the feature here.
default = []
onnx_upscale = ["kcreate_ai/onnx_upscale"]
onnx_segment = ["kcreate_ai/onnx_segment"]

[dev-dependencies]
# `llm_sidecar` brings in `ureq` for the loopback HTTP client used by
# the Phase 1/3/4 sidecars. The deny-list test
# (`tests/local_first.rs`) checks the editing-path crates with
# default features only, so enabling it for the integration tests
# does not weaken the invariant.
kcreate_ai = { path = "../kcreate_ai", features = ["llm_sidecar"] }
kcreate_audit = { path = "../kcreate_audit" }
kcreate_collab = { path = "../kcreate_collab" }
kcreate_core = { path = "../kcreate_core" }
kcreate_export = { path = "../kcreate_export" }
kcreate_layout = { path = "../kcreate_layout" }
kcreate_mcp = { path = "../kcreate_mcp" }
kcreate_plugin = { path = "../kcreate_plugin" }
kcreate_raster = { path = "../kcreate_raster" }
kcreate_renderer = { path = "../kcreate_renderer" }
kcreate_storage = { path = "../kcreate_storage" }
kcreate_text = { path = "../kcreate_text" }
kcreate_vector = { path = "../kcreate_vector" }
# Phase 7 integration tests (kchat_backend_client.rs). Enables the
# `test-fixture` feature so the in-process axum REST fixture is
# accessible; the editing-path deny-list check
# (`tests/local_first.rs`) does not walk `kcreate_tests` itself, so
# this does not weaken the local-first invariant.
kcreate_kchat_client = { path = "../kcreate_kchat_client", features = ["test-fixture"] }
# Phase 8 Block A integration test (kchat_artifact.rs). Drives the
# bridge entry points (`kchat_backend_publish_artifact`, etc.)
# end-to-end against the axum fixture. The `kchat-backend` feature
# pulls in `kcreate_kchat_client` + tokio inside the bridge; the
# local-first deny-list test (`local_first.rs`) only walks the
# editing-path crates under DEFAULT features, so enabling the
# feature here does not weaken the invariant.
kcreate_bridge = { path = "../kcreate_bridge", features = ["kchat-backend", "mcp"] }
# Phase 7 Block B: community-gated collab tests (collab_communities.rs).
kcreate_collab_transport = { path = "../kcreate_collab_transport" }
ed25519-dalek = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "fs", "time"] }
chrono = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tiny_http = "0.12"
uuid = { workspace = true }
base64 = { workspace = true }
# Decode-only PNG helper for the integration tests. Used by the
# gradient render-parity proof (gradient_render_parity.rs) to assert
# the raster pixels form a real gradient ramp, and by the G2
# template-library proof (template_library_bridge.rs) to assert the
# rendered thumbnails are non-blank (>= 2 distinct colours). Not
# pulled into any editing-path crate.
image = { workspace = true }
# Phase 8 Block A integration test (kchat_artifact.rs) — same
# version pin as the bridge's own use to keep the proc-macro
# crate de-duplicated in the dep graph.
serial_test = "3"
# Used by Phase 10 Block C integration test (export_ai.rs) to verify
# that multi-page PDF assembly produces structurally-valid PDFs
# (page count, /Outlines catalog entry). Not pulled into editing-path
# crates — only into the integration-test crate.
lopdf = { workspace = true }

[lints]
workspace = true
