[workspace]
resolver = "2"
members = [
    "crates/kcreate_renderer",
    "crates/kcreate_bridge",
    "crates/kcreate_core",
    "crates/kcreate_storage",
    "crates/kcreate_vector",
    "crates/kcreate_export",
    "crates/kcreate_perf",
    "crates/kcreate_raster",
    "crates/kcreate_text",
    "crates/kcreate_layout",
    "crates/kcreate_ai",
    "crates/kcreate_mcp",
    "crates/kcreate_plugin",
    "crates/kcreate_audit",
    "crates/kcreate_collab",
    # NOTE: kcreate_collab_transport is intentionally OUT of
    # `kcreate_tests/tests/local_first.rs::editing_path_crates()` so it
    # can pull QUIC / mDNS / rustls without breaking the local-first
    # contract — the bridge depends on it only behind the `collab`
    # feature flag.
    "crates/kcreate_collab_transport",
    # KChat membership issuer (dev tooling). Like
    # `kcreate_collab_transport`, this is OUT of
    # `kcreate_tests/tests/local_first.rs::editing_path_crates()` —
    # it depends on `kcreate_collab` for the wire-format types and
    # is only pulled into the bridge under the off-by-default
    # `kchat-dev-issuer` feature.
    "crates/kcreate_kchat",
    # Phase 7 KChat backend REST client. Like
    # `kcreate_collab_transport` and `kcreate_kchat`, this is OUT
    # of `kcreate_tests/tests/local_first.rs::editing_path_crates`
    # — it links `reqwest`/`rustls` to talk to the shared KChat /
    # Mattermost backend over HTTPS and is only pulled into the
    # bridge under the off-by-default `kchat-backend` feature flag.
    "crates/kcreate_kchat_client",
    "crates/kcreate_tests",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
authors = ["KCreate contributors"]
repository = "https://github.com/kennguy3n/KCreate"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
# Stylistic preferences that don't catch real bugs:
many_single_char_names = "allow"     # x/y/w/h and HSL/RGB are conventional
doc_markdown = "allow"               # acronyms like XObject, IPC, MCP shouldn't need backticks
too_long_first_doc_paragraph = "allow"
needless_pass_by_value = "allow"     # sometimes ownership is intentional (thread moves)
single_match_else = "allow"
manual_let_else = "allow"
option_if_let_else = "allow"
# Nursery lints that over-fire on the codebase:
missing_const_for_fn = "allow"       # often wrong on platform-specific code
significant_drop_tightening = "allow" # conflicts with explicit unlock points
float_cmp = "allow"                   # intentional in test assertions
redundant_pub_crate = "allow"
suboptimal_flops = "allow"            # mul_add is rarely a real win and obscures intent
branches_sharing_code = "allow"
missing_fields_in_debug = "allow"
unused_async = "allow"
or_fun_call = "allow"

[workspace.dependencies]
# GPU rendering
wgpu = { version = "29.0", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "gles", "naga-ir", "std", "wgpu-core"] }
# Window handle abstraction used by `kcreate_renderer::native_surface`
# for Phase 1's direct-to-swapchain presentation path. The version is
# pinned to the same release wgpu 29 re-exports so we never end up
# with two raw-window-handle crates in the dependency graph (which
# would silently break the `unsafe`-free `HasWindowHandle` trait
# impl on the same type).
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1.16", features = ["derive"] }

# CPU rasterization fallback (real, production-quality software renderer)
tiny-skia = "0.11"

# Math
glam = { version = "0.29", features = ["bytemuck"] }

# Async / sync
parking_lot = { version = "0.12", features = ["arc_lock"] }
crossbeam-channel = "0.5"

# Logging / errors
log = "0.4"
thiserror = "1.0"

# Cross-platform shared memory for frame buffers
shared_memory = "0.12"

# Identifiers
uuid = { version = "1.10", features = ["v4", "serde"] }

# Serialization (used in display list cache + IPC payloads)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# Persistence (statically linked SQLite)
# SQLCipher (vendored OpenSSL) so encrypted projects work on every
# platform without a system OpenSSL dependency. SQLCipher is a
# superset of SQLite: plaintext databases continue to open and
# write normally as long as no `PRAGMA key` is set, so this also
# satisfies the legacy `bundled` use case.
rusqlite = { version = "0.34", features = ["bundled-sqlcipher-vendored-openssl", "blob", "chrono", "uuid"] }

# Content-addressed hashing
blake3 = "1.5"

# Path math
kurbo = { version = "0.11", features = ["serde"] }

# Polygon boolean operations (Greiner–Hormann / Vatti family, real production-grade impl)
i_overlay = "2"

# SVG parsing
usvg = "0.44"

# Spatial index
rstar = "0.12"

# Raster encoding (PNG, JPEG, WebP)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# PDF export
printpdf = { version = "0.7", default-features = false, features = ["embedded_images"] }

# PDF import (Phase 3 foundation — pure Rust, no native deps,
# already in the dep tree transitively via printpdf so this is a
# zero-cost direct dep).
lopdf = { version = "0.31", default-features = false, features = ["pom_parser"] }

# Data-parallel iteration (used by raster tile ops + batch export)
rayon = "1.10"

# ZIP archive read/write for the `.kbrand` portable brand kit format
# (manifest.json + fonts/ + logos/). Pure Rust, no native deps.
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Font discovery + text shaping (Phase 1 text crate)
fontdb = { version = "0.22", default-features = false, features = ["std", "memmap", "fs"] }
rustybuzz = "0.18"

# Base64 used by image wire format for inlined pixel payloads
base64 = "0.22"

# Loopback-only HTTP server for the local MCP sidecar
tiny_http = { version = "0.12", default-features = false }

# WASM plugin sandbox runtime. `wasmi` is a pure-Rust interpreter — no
# LLVM dependency, no native runtime download — so it compiles on every
# CI platform without extra system deps. The plugin crate exposes a
# minimal `kcreate_log` / `kcreate_get_input` / `kcreate_set_output`
# host ABI; plugins have no filesystem or network access by design.
wasmi = { version = "0.42", default-features = false, features = ["std"] }

# Ed25519 signature verification for native plugins. Pure-Rust (no
# OpenSSL), constant-time crypto by construction; we use `verify_strict`
# everywhere so weak / malleable signatures are rejected. Used by the
# trust store in `kcreate_plugin::trust`. Phase 7 (Task 23) also uses
# this with `hazmat` to derive X25519 key-agreement keys from the
# long-lived Ed25519 identity keys.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "fast", "hazmat"] }
# Phase 7 (Task 23): low-level Edwards / Montgomery operations used
# to derive an X25519 public key from a long-lived Ed25519 identity
# (the standard birationally-equivalent point map). Already an
# `ed25519-dalek` dependency so this is a zero-cost direct dep.
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "zeroize", "digest"] }
# Phase 7 (Task 23): AEAD used for secure clipboard sharing between
# peers. Pure-Rust (RustCrypto), no OpenSSL. The X25519 shared
# secret derived from the peers' Ed25519 identity keys is fed
# through BLAKE3 (already in the tree) to produce the ChaCha20
# key + nonce material.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# Phase 7 (Task 23): OS RNG for fresh ChaCha20-Poly1305 nonces on
# the clipboard-share send path. Already in the dep tree
# transitively via curve25519-dalek; pulling it in directly keeps
# the call site auditable.
#
# Phase 11 Block E follow-up — Devin Review ANALYSIS-0002.
# Pinned at 0.3 so every caller in the workspace (kcreate_collab,
# kcreate_bridge, kcreate_ai LLM sidecar) goes through the same
# `getrandom::fill(&mut buf)` API. Earlier this lived at 0.2 with
# `kcreate_ai` overriding to 0.3 directly, which left two copies of
# the crate in the dep tree and split the call style. The 0.3
# release is API-renamed (getrandom → fill) but is otherwise the
# same OS-CSPRNG wrapper, so the security posture is unchanged.
getrandom = "0.3"

# Phase 3 LAN transport — these are intentionally pulled in only by
# `kcreate_collab_transport` (and transitively, the bridge under the
# `collab` feature). The editing-path crates never reach them, which is
# what keeps the local-first sentinel green. quinn's `rustls-ring`
# feature gives us a pure-Rust TLS stack with no OpenSSL link.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "ring", "log"] }
# rustls is brought in by quinn but we also use it directly for the
# custom certificate verifier that pins peer certs to the SHA-256
# fingerprint advertised in mDNS.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging"] }
rustls-pki-types = "1"
# Ephemeral self-signed TLS certificates derived per session. The
# Ed25519 peer identity remains the trust anchor; rcgen just provides
# the TLS cert chain the QUIC stack requires.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
# Pure-Rust mDNS responder + browser. No system avahi/Bonjour deps.
# 0.13 is the latest version supported by quinn 0.11's MSRV.
mdns-sd = { version = "0.13", default-features = false }
# Async runtime for the transport actor. Editing path stays sync —
# this only enters the tree behind the `collab` feature.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
# Logging shim used by tracing crates pulled in by quinn / rustls; we
# already depend on `log` at the workspace level so this is a free dep.
tracing = "0.1"
# Custom server-cert verifier needs a small SHA-256 helper.
sha2 = "0.10"
# Phase 11 Block E Task 28: Mozilla root CA bundle used by the KChat
# REST client when certificate pinning is enabled. With a pin, we
# still want full chain validation against well-known roots before
# the leaf-fingerprint check — defeating one shouldn't be cheaper
# than defeating the other. `webpki-roots` is already pulled in as a
# transitive of `reqwest` (via `hyper-rustls`), so this just promotes
# it to a first-class dep so the rustls `ClientConfig` we build can
# load `TLS_SERVER_ROOTS` directly without going through reqwest's
# internal path.
webpki-roots = "1.0"

# Phase 7 (Option C pivot): REST client for the shared KChat /
# Mattermost backend. Only enters the editing-path closure walked by
# `local_first.rs` if some editing-path crate accidentally takes a
# dependency on `kcreate_kchat_client` outside the off-by-default
# `kchat-backend` feature flag — which the deny-list test would
# catch immediately.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "deflate", "multipart"] }
# Test-only in-process HTTP server that mirrors the future KChat
# backend REST contract. Used as a dev-dependency only — never
# enters any production binary. See
# `crates/kcreate_kchat_client/src/fixture.rs`.
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "tracing", "query", "multipart"] }
# URL parsing for the REST client (validates scheme + host before
# every request, refuses `http://` outside the test fixture).
url = "2"

# System info probe for device tiering
sys-info = "0.9"

# Phase 9: cross-platform system memory probe for the memory-pressure
# watchdog. Pure Rust, no networking, MIT-licensed. `sys-info` cannot
# report available memory on every platform consistently — `sysinfo`
# does and is already in the Cargo registry via several transitive
# deps in the workspace.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Phase 9 Block C Task 13: PSD layered raster importer. Pure-Rust,
# no native deps, MIT-licensed. Parses Adobe Photoshop `.psd` files
# down to layer pixel data + bounds + blend mode + opacity.
psd = "0.3"

# Phase 9 Block C Task 14: EXIF metadata extraction for JPEG / TIFF /
# WebP / HEIC. Pure Rust (kamadak-exif), no native deps, BSD-licensed.
# Used by `kcreate_export::jpeg` / `webp` import paths to preserve
# EXIF metadata on round-trip.
kamadak-exif = "0.6"

# Phase 9 Block C Task 16: SVG-to-raster preview rasteriser. Pure
# Rust, no native deps (uses `usvg` + `tiny-skia` which are already
# in the workspace dep graph). Used for thumbnail generation of
# SVG-only artboards and for the Export panel SVG preview.
resvg = { version = "0.47", default-features = false, features = ["text"] }

# Benchmarks
criterion = { version = "0.5", features = ["html_reports"] }

# Test fixtures
tempfile = "3"

# N-API bindings
# `dyn-symbols` resolves napi symbols at runtime via libloading so the crate
# can be unit-tested without a live Node.js process providing static symbols
# at link time. When loaded by Node it transparently uses the host's symbols.
napi = { version = "2.16", default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = "2.16"
napi-build = "2.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1
debug = true
