[workspace]
resolver = "2"
members = [
    "crates/kcreate_renderer",
    "crates/kcreate_bridge",
    "crates/kcreate_core",
    "crates/kcreate_storage",
    "crates/kcreate_vector",
    "crates/kcreate_export",
    "crates/kcreate_raster",
    "crates/kcreate_text",
    "crates/kcreate_layout",
    "crates/kcreate_ai",
    "crates/kcreate_mcp",
    "crates/kcreate_tests",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
authors = ["KCreate contributors"]
repository = "https://github.com/kennguy3n/KCreate"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
# Stylistic preferences that don't catch real bugs:
many_single_char_names = "allow"     # x/y/w/h and HSL/RGB are conventional
doc_markdown = "allow"               # acronyms like XObject, IPC, MCP shouldn't need backticks
too_long_first_doc_paragraph = "allow"
needless_pass_by_value = "allow"     # sometimes ownership is intentional (thread moves)
single_match_else = "allow"
manual_let_else = "allow"
option_if_let_else = "allow"
# Nursery lints that over-fire on the codebase:
missing_const_for_fn = "allow"       # often wrong on platform-specific code
significant_drop_tightening = "allow" # conflicts with explicit unlock points
float_cmp = "allow"                   # intentional in test assertions
redundant_pub_crate = "allow"
suboptimal_flops = "allow"            # mul_add is rarely a real win and obscures intent
branches_sharing_code = "allow"
missing_fields_in_debug = "allow"
unused_async = "allow"
or_fun_call = "allow"

[workspace.dependencies]
# GPU rendering
wgpu = { version = "29.0", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "gles", "naga-ir", "std", "wgpu-core"] }
pollster = "0.4"
bytemuck = { version = "1.16", features = ["derive"] }

# CPU rasterization fallback (real, production-quality software renderer)
tiny-skia = "0.11"

# Math
glam = { version = "0.29", features = ["bytemuck"] }

# Async / sync
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Logging / errors
log = "0.4"
thiserror = "1.0"

# Cross-platform shared memory for frame buffers
shared_memory = "0.12"

# Identifiers
uuid = { version = "1.10", features = ["v4", "serde"] }

# Serialization (used in display list cache + IPC payloads)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# Persistence (statically linked SQLite)
rusqlite = { version = "0.34", features = ["bundled", "blob", "chrono", "uuid"] }

# Content-addressed hashing
blake3 = "1.5"

# Path math
kurbo = { version = "0.11", features = ["serde"] }

# Polygon boolean operations (Greiner–Hormann / Vatti family, real production-grade impl)
i_overlay = "2"

# SVG parsing
usvg = "0.44"

# Spatial index
rstar = "0.12"

# Raster encoding (PNG, JPEG, WebP)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# PDF export
printpdf = { version = "0.7", default-features = false, features = ["embedded_images"] }

# Data-parallel iteration (used by raster tile ops + batch export)
rayon = "1.10"

# Font discovery + text shaping (Phase 1 text crate)
fontdb = { version = "0.22", default-features = false, features = ["std", "memmap", "fs"] }
rustybuzz = "0.18"

# Base64 used by image wire format for inlined pixel payloads
base64 = "0.22"

# Loopback-only HTTP server for the local MCP sidecar
tiny_http = { version = "0.12", default-features = false }

# System info probe for device tiering
sys-info = "0.9"

# Benchmarks
criterion = { version = "0.5", features = ["html_reports"] }

# Test fixtures
tempfile = "3"

# N-API bindings
# `dyn-symbols` resolves napi symbols at runtime via libloading so the crate
# can be unit-tested without a live Node.js process providing static symbols
# at link time. When loaded by Node it transparently uses the host's symbols.
napi = { version = "2.16", default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = "2.16"
napi-build = "2.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 1
debug = true
